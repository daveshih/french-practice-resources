.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:.82rem;color:var(--muted)}
.meta strong{color:var(--ink)}
.progress-bar{height:4px;background:var(--border);border-radius:2px;margin-bottom:20px;overflow:hidden}

.sentence-wrap{background:repeating-linear-gradient(transparent,transparent 27px,var(--rule-line) 27px,var(--rule-line) 28px);padding:10px 12px 14px;margin:0 -4px 22px;border-radius:1px}
.sentence{font-family:'Palatino Linotype',Palatino,Georgia,serif;font-size:1.35rem;line-height:28px}
.blank{display:inline-block;min-width:88px;border-bottom:2.5px solid var(--blue);margin:0 4px -2px;text-align:center;color:var(--blue);font-style:italic;vertical-align:bottom}
.ans-filled{display:inline-block;color:var(--blue);font-weight:bold;font-style:italic;border-bottom:2.5px solid var(--blue);min-width:88px;text-align:center;margin:0 4px -2px;vertical-align:bottom;animation:inkIn .35s ease-out}
@keyframes inkIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:20px}
.opt-btn{padding:14px 8px 11px;border:1.5px solid var(--border);border-radius:2px;background:#fff;font-size:1.15rem;font-family:'Palatino Linotype',Palatino,Georgia,serif;cursor:pointer;transition:border-color .12s,background .12s,transform .12s,box-shadow .12s;color:var(--ink);text-align:center}

.opt-btn:disabled{cursor:default}
.opt-btn.correct{border-color:var(--green);background:var(--green-light);color:var(--green)}
.opt-btn.wrong{border-color:#E8DCDC;background:#FBF5F5;color:#C8B8B8}
.opt-btn.picked-wrong{border-color:var(--red);background:#FEF2F2;color:var(--red)}
.explanation{display:none;border-left:3px solid var(--blue);padding:12px 14px;margin-bottom:16px;background:var(--blue-light);border-radius:0 2px 2px 0;animation:slideIn .25s ease-out}
.explanation.show{display:block}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.exp-verdict{font-size:1rem;font-weight:600;margin-bottom:6px}
.exp-verdict.ok{color:var(--green)}.exp-verdict.ko{color:var(--red)}
.exp-note{font-size:.88rem;color:var(--muted);margin-bottom:2px}

.exp-english{font-size:.82rem;color:var(--muted);font-style:italic;margin-bottom:8px}
.exp-rule{font-size:.84rem;color:var(--ink);line-height:1.55;padding-top:8px;border-top:1px solid rgba(0,46,140,.15)}

.actions{display:none;justify-content:flex-end}
.actions.show{display:flex}
.btn-next{padding:10px 28px;background:var(--blue);color:#fff;border:none;border-radius:2px;font-size:.95rem;font-family:'Palatino Linotype',Palatino,Georgia,serif;cursor:pointer;letter-spacing:.02em;transition:background .15s;box-shadow:0 2px 8px rgba(0,46,140,.2)}
.btn-next:hover{background:#003BB5}
.btn-exit{background:none;border:1.5px solid var(--border);border-radius:50%;width:26px;height:26px;font-size:.65rem;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;padding:0;line-height:1}

.start-screen,.end-screen{text-align:center;padding:20px 0}
.start-screen h2,.end-screen h2{font-family:'Palatino Linotype',Palatino,Georgia,serif;font-size:1.6rem;font-weight:normal;color:var(--blue);margin-bottom:14px}

.final-grade{font-size:1.2rem;margin-bottom:10px}

.toast.show{transform:translateX(-50%) translateY(0)}

.results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.results-section h3{font-family:-apple-system,sans-serif;font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}

.results-table colgroup col:nth-child(3){width:20%}

.rt-note b{color:var(--blue)}
.rt-english{font-size:.75rem;color:var(--muted);font-style:italic;margin-top:2px}
.rt-cat{font-size:.85rem;color:var(--blue);font-family:'Palatino Linotype',Palatino,Georgia,serif;font-weight:bold}

  background: var(--paper);

  var pct = idx / questions.length * 100;
  app.innerHTML = "\n    <div class=\"meta\">\n      <span>".concat(idx + 1, " <span style=\"color:var(--border)\">/ ").concat(questions.length, "</span></span>\n      <span style=\"display:flex;align-items:center;gap:10px\">Score <strong>").concat(score, "</strong>\n        <button class=\"btn-exit\" id=\"btn-exit\" title=\"Quitter\">&#10005;</button>\n      </span>\n    </div>\n    <div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:").concat(pct, "%\"></div></div>\n    <div class=\"sentence-wrap\"><div class=\"sentence\">").concat(fmtBlank(q.s), "</div></div>\n    <div class=\"options\">").concat(opts.map(function (o) {
    return "<button class=\"opt-btn\" data-val=\"".concat(o, "\">").concat(o, "</button>");
  }).join(''), "</div>\n    <div class=\"explanation\" id=\"exp\"></div>\n    <div class=\"actions\" id=\"acts\"><button class=\"btn-next\" id=\"btn-next\">Suivant &rarr;</button></div>");
}
function fmtBlank(s) {
  return s.replace('___', '<span class="blank">___</span>');
}
function fmtFilled(s, a) {
  return s.replace('___', "<span class=\"ans-filled\">".concat(a, "</span>"));
}
function handleAnswer(btn) {
  if (answered) return;
  answered = true;
  var q = questions[idx],
    chosen = btn.dataset.val,
    correct = chosen === q.a;
  if (correct) score++;
  sessionResults.push({
    s: q.s,
    a: q.a,
    c: q.c,
    n: q.n,
    e: q.e,
    correct: correct,
    chosen: chosen
  });
  renderResultsTable();
  var _optBtns = app.querySelectorAll('.opt-btn');
  for (var _obi = 0; _obi < _optBtns.length; _obi++) {
    var b = _optBtns[_obi];
    b.disabled = true;
    if (b.dataset.val === q.a) b.classList.add('correct');else if (b === btn) b.classList.add('picked-wrong');else b.classList.add('wrong');
  }
  app.querySelector('.sentence').innerHTML = fmtFilled(q.s, q.a);
  var exp = document.getElementById('exp');
  exp.classList.add('show');
  exp.innerHTML = "\n    <div class=\"exp-verdict ".concat(correct ? 'ok' : 'ko', "\">\n      ").concat(correct ? '&#10003; Correct&#160;!' : "&#10007; La r&eacute;ponse correcte est <strong>".concat(q.a, "</strong>"), "\n    </div>\n    <div class=\"exp-note\">").concat(q.n, "</div>\n    <div class=\"exp-english\">").concat(q.e, "</div>\n    <div class=\"exp-rule\">").concat(q.r, "</div>");
  document.getElementById('acts').classList.add('show');
}
function nextQ() {
  idx++;
  answered = false;
  renderQ();
}
function showEnd() {
  var pct = Math.round(score / questions.length * 100);
  var grade = pct >= 90 ? '&#127775; Excellent&#160;!' : pct >= 75 ? '&#128077; Tr&egrave;s bien&#160;!' : pct >= 60 ? '&#128522; Bien — continuez&#160;!' : pct >= 45 ? '&#128218; Pas mal — r&eacute;visez&#160;!' : '&#128170; Ne vous d&eacute;couragez pas&#160;!';
  app.innerHTML = "\n    <div class=\"end-screen\">\n      <h2>Quiz termin&eacute;&#160;!</h2>\n      <div class=\"final-score\">".concat(score, "<span style=\"font-size:1.5rem;color:var(--muted)\"> / ").concat(questions.length, "</span></div>\n      <div class=\"final-pct\">").concat(pct, "&#160;%</div>\n      <div class=\"final-grade\">").concat(grade, "</div>\n      <button class=\"btn-restart\" id=\"btn-restart\">Recommencer &#8635;</button>\n    </div>");
}
function exitToStart() {
  sessionResults = [];
  showCorrect = true;
  idx = 0;
  score = 0;
  answered = false;
  var rs = document.getElementById('results-section');
  if (rs) rs.style.display = 'none';
  var rb = document.getElementById('results-tbody');
  if (rb) rb.innerHTML = '';
  var btc = document.getElementById('btn-toggle-correct');
  if (btc) {
    btc.textContent = 'Masquer les bonnes réponses';
    btc.classList.remove('hiding');
  }
  showStart();
}
function toggleCorrect() {
  showCorrect = !showCorrect;
  var btn = document.getElementById('btn-toggle-correct');
  if (btn) {
    btn.textContent = showCorrect ? 'Masquer les bonnes réponses' : 'Afficher les bonnes réponses';
    btn.classList.toggle('hiding', !showCorrect);
  }
  renderResultsTable();
}
function renderResultsTable() {
  var sec = document.getElementById('results-section');
  if (sec) sec.style.display = 'block';
  var tbody = document.getElementById('results-tbody');
  if (!tbody) return;
  var rows = showCorrect ? sessionResults : sessionResults.filter(function (r) {
    return !r.correct;
  });
  tbody.innerHTML = rows.map(function (r) {
    var filled = r.s.replace('___', "<span class=\"".concat(r.correct ? 'rt-ans-correct' : 'rt-ans-wrong', "\">").concat(r.a, "</span>"));
    var wrongNote = r.correct ? '' : "<div class=\"rt-picked\">&#10007;&nbsp;choisi&nbsp;: <strong>".concat(r.chosen, "</strong></div>");
    return "<tr class=\"".concat(r.correct ? 'rt-row-correct' : 'rt-row-wrong', "\">\n      <td><span class=\"rt-sentence\" data-modal=\"").concat(function () {
      var k = _mIdx++;
      MODAL_DATA.set(k, {
        fr: r.n.replace(/<[^>]+>/g, ''),
        en: r.e
      });
      return k;
    }(), "\">").concat(filled, "</span>").concat(wrongNote, "</td>\n      <td><span class=\"rt-note\">").concat(r.n, "</span><div class=\"rt-english\">").concat(r.e, "</div></td>\n      <td class=\"rt-cat\">").concat(r.a, "</td></tr>");
  }).join('');
}
app.addEventListener('click', function (e) {
  var rs = e.target.closest('.rt-sentence');
  if (rs) {
    showWordModal(parseInt(rs.dataset.modal), rs);
    e.stopPropagation();
    return;
  }
  var opt = e.target.closest('.opt-btn');
  if (opt && !answered) {
    handleAnswer(opt);
    return;
  }
  var btnEl = e.target.closest('button');
  var id = e.target.id || btnEl && btnEl.id;
  if (id === 'btn-next') {
    nextQ();
    return;
  }
  if (id === 'btn-exit') {
    exitToStart();
    return;
  }
  if (id === 'btn-start' || id === 'btn-restart') {
    questions = shuffle(buildPool()).slice(0, 20);
    idx = 0;
    score = 0;
    answered = false;
    sessionResults = [];
    showCorrect = true;
    var _rs = document.getElementById('results-section');
    if (_rs) _rs.style.display = 'none';
    var rb = document.getElementById('results-tbody');
    if (rb) rb.innerHTML = '';
    var btc = document.getElementById('btn-toggle-correct');
    if (btc) {
      btc.textContent = 'Masquer les bonnes réponses';
      btc.classList.remove('hiding');
    }
    renderQ();
  }
});
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === 'ArrowRight') && answered) {
    nextQ();
    return;
  }
  if (!answered && ['1', '2', '3', '4', '5', '6'].indexOf(e.key) !== -1) {
    var btns = app.querySelectorAll('.opt-btn');
    var btn = btns[parseInt(e.key) - 1];
    if (btn) handleAnswer(btn);
  }
});
init();
</script>
</body>
</html>
